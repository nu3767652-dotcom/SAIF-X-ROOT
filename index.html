<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>SAIF X ROOT LIVE</title><style>body{background:#000;color:#0f0;text-align:center;font-family:monospace}h1{border:2px solid #0f0;padding:10px;text-shadow:0 0 10px #0f0}canvas{background:#111;border:1px solid #0f0}button{background:#0f0;color:#000;padding:12px 25px;font-weight:bold;border-radius:10px}</style></head><body><h1>GAME ZONE<br>SAIF X ROOT</h1><h2 id="d" style="font-size:70px">1</h2><button onclick="d.innerText=Math.floor(Math.random()*6)+1">ROLL DICE</button><hr><canvas id="g" width="300" height="300"></canvas><br><br><button onclick="start()">START SNAKE</button><p>Score: <span id="sc">0</span></p><script>let s,c=0,sc=document.getElementById('sc'),cv=document.getElementById('g').getContext('2d'),sn=[{x:150,y:150}],dir={x:10,y:0},fd={x:100,y:100};function start(){clearInterval(s);sn=[{x:150,y:150}];dir={x:10,y:0};c=0;sc.innerText=0;s=setInterval(loop,100)}function loop(){let h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};if(h.x<0)h.x=290;if(h.x>290)h.x=0;if(h.y<0)h.y=290;if(h.y>290)h.y=0;sn.unshift(h);if(h.x==fd.x&&h.y==fd.y){c++;sc.innerText=c;fd={x:Math.floor(Math.random()*30)*10,y:Math.floor(Math.random()*30)*10}}else sn.pop();cv.fillStyle='#111';cv.fillRect(0,0,300,300);cv.fillStyle='#0f0';sn.forEach(p=>cv.fillRect(p.x,p.y,9,9));cv.fillStyle='red';cv.fillRect(fd.x,fd.y,9,9)}onkeydown=e=>{if(e.key=='ArrowUp'&&dir.y==0)dir={x:0,y:-10};if(e.key=='ArrowDown'&&dir.y==0)dir={x:0,y:10};if(e.key=='ArrowLeft'&&dir.x==0)dir={x:-10,y:0};if(e.key=='ArrowRight'&&dir.x==0)dir={x:10,y:0}}</script></body></html>
